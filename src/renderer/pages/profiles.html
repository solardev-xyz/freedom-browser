<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>Profiles</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjOGI5NDllIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTIwIDIxYTggOCAwIDAgMC0xNiAwIi8+PGNpcmNsZSBjeD0iMTIiIGN5PSI3IiByPSI0Ii8+PC9zdmc+"
    />
    <link rel="stylesheet" href="styles/theme.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family:
          'IBM Plex Sans',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        /* Fixed attachment keeps the gradient covering the full viewport even
           when the page scrolls, so it never truncates at the bottom. */
        background: var(--page-gradient-profiles);
        color: var(--text);
        min-height: 100vh;
      }

      .page {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 32px 64px;
      }

      .page-head {
        margin-bottom: 24px;
      }

      /* Shared internal-page header (#256): a 28 px accent title laid out as a
         flex row with an inline icon, over a one-line count subtitle — the
         same pattern history, downloads, links and payments use. The accent
         comes from the token, so it is #58a6ff dark / #0969da light like the
         siblings' literals. */
      .page-title {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 8px 0;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.5px;
        color: var(--accent);
      }

      .subtitle {
        margin: 0;
        font-size: 14px;
        color: var(--text-muted);
      }

      .btn {
        padding: 8px 14px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        transition:
          border-color 0.1s,
          background 0.1s;
      }

      .btn:hover:not(:disabled) {
        border-color: var(--border-strong);
        background: var(--bg-card);
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
        font-weight: 600;
      }

      .btn.primary:hover:not(:disabled) {
        background: #79b8ff;
        border-color: #79b8ff;
      }

      .btn.danger {
        border-color: rgba(248, 81, 73, 0.45);
        color: var(--danger);
      }

      .btn.danger:hover:not(:disabled) {
        border-color: var(--danger);
      }

      /* Tiled grid */
      .profile-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 16px;
        align-items: stretch;
      }

      .profile-manager-empty {
        grid-column: 1 / -1;
        padding: 18px;
        color: var(--text-muted);
        font-size: 13px;
        text-align: center;
      }

      /* Transient status toast for action failures (delete/open/register/edit).
         Mirrors the hamburger flyout's status line: quiet on success, a brief
         message on error so failures aren't silent. */
      .profile-toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        max-width: min(90vw, 440px);
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.4;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        z-index: 1000;
      }

      .profile-toast.error {
        background: #b3261e;
        color: #fff;
      }

      .profile-toast.info {
        background: var(--bg-card);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .profile-card {
        display: flex;
        flex-direction: column;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }

      /* The currently active profile gets a persistent accent-tinted highlight. */
      .profile-card.is-active {
        border-color: var(--accent);
        background: var(--accent-muted);
      }

      /* Cards and the create tile share one aspect ratio so they're always the
         same height — including when the create tile wraps onto its own row. */
      .profile-card,
      .create-tile {
        aspect-ratio: 15 / 16;
      }

      .profile-card-avatar {
        position: relative;
        display: block;
        width: 100%;
        flex: 1;
        min-height: 0;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        overflow: hidden;
      }

      .profile-card-avatar.is-active,
      .profile-card-avatar:disabled {
        cursor: default;
      }

      .avatar-svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Openable profiles get a distinct (neutral) lighten on hover, separate
         from the active profile's accent highlight. */
      .profile-card-avatar[data-open-profile]::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.1);
        opacity: 0;
        transition: opacity 0.12s ease;
        pointer-events: none;
      }

      .profile-card-avatar[data-open-profile]:hover::after {
        opacity: 1;
      }

      .avatar-badge {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(13, 17, 23, 0.55);
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        line-height: 1.4;
        backdrop-filter: blur(4px);
      }

      .profile-card-avatar.is-unregistered .avatar-svg {
        opacity: 0.55;
      }

      .profile-card-foot {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 7px 7px 7px 11px;
        border-top: 1px solid var(--border);
      }

      .profile-card-namewrap {
        flex: 1;
        min-width: 0;
      }

      .profile-card-name {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: default;
      }

      /* Floating hover tooltip for clipped names. Mirrors lib/hover-tooltip.js
         (this page runs classic scripts, so it can't import that module);
         keep the chrome and the 250ms delay below in sync with it. */
      .hover-tooltip {
        position: fixed;
        pointer-events: none;
        padding: 2px 8px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 3px;
        font-size: 11px;
        color: var(--text);
        white-space: nowrap;
        z-index: 10001;
      }

      .hover-tooltip[hidden] {
        display: none !important;
      }

      .profile-card-controls {
        display: flex;
        align-items: center;
        gap: 2px;
        flex-shrink: 0;
      }

      .icon-btn {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        padding: 0;
        background: none;
        border: 0;
        border-radius: 6px;
        color: var(--text-muted);
        cursor: pointer;
        transition:
          background 0.1s,
          color 0.1s;
      }

      .icon-btn:hover:not(:disabled) {
        background: var(--bg-elev);
        color: var(--text);
      }

      .icon-btn.danger:hover:not(:disabled) {
        color: var(--danger);
      }

      .icon-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .link-btn {
        padding: 4px 6px;
        background: none;
        border: 0;
        color: var(--accent);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .link-btn:hover {
        text-decoration: underline;
      }

      .create-tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 18px;
        background: none;
        border: 2px dashed var(--border-strong);
        border-radius: 12px;
        color: var(--text-muted);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          border-color 0.12s,
          color 0.12s;
      }

      .create-tile:hover {
        border-color: var(--accent);
        color: var(--text);
      }

      /* Delete confirmation modal — mirrors the app chrome's Create Profile
         modal (src/renderer/styles/modal.css) so the two look identical. It
         paints from the chrome-flavoured --m-* tokens in styles/theme.css
         rather than this page's own palette. */
      .modal-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.5);
        z-index: 50;
      }

      .modal-overlay[hidden] {
        display: none;
      }

      .modal {
        width: min(420px, calc(100vw - 32px));
        padding: 20px;
        background: var(--m-bg);
        border: 1px solid var(--m-border);
        border-radius: 8px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
        color: var(--m-text);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .modal-header h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: var(--m-text);
      }

      .close-modal {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--m-text);
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .close-modal:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .modal-copy {
        margin: 0;
        color: var(--m-muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .modal-copy strong {
        color: var(--m-text);
      }

      .modal-profile {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 14px;
        padding: 10px 12px;
        border: 1px solid var(--m-border);
        border-radius: 8px;
      }

      .modal-profile-avatar {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        overflow: hidden;
      }

      .modal-profile-name {
        min-width: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--m-text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
      }

      .secondary-btn,
      .primary-btn {
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
        font-family: inherit;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      .secondary-btn {
        background: transparent;
        border: 1px solid var(--m-border);
        color: var(--m-text);
      }

      .primary-btn {
        background: var(--m-accent);
        color: #fff;
      }

      .primary-btn.danger {
        background: var(--m-danger);
      }

      .secondary-btn:hover:not(:disabled),
      .primary-btn:hover:not(:disabled) {
        opacity: 0.9;
      }

      .primary-btn:disabled {
        opacity: 0.55;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="page-head">
        <h1 class="page-title">
          <svg
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 21a8 8 0 0 0-16 0" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          Profiles
        </h1>
        <p class="subtitle" id="stats">Loading…</p>
      </div>

      <div class="profile-grid" id="profile-manager-list">
        <div class="profile-manager-empty">Loading…</div>
      </div>
    </main>

    <div class="modal-overlay" id="delete-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
        <div class="modal-header">
          <h2 id="delete-modal-title">Delete profile?</h2>
          <button type="button" class="close-modal" data-delete-cancel aria-label="Close">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 6 6 18" />
              <path d="M6 6 18 18" />
            </svg>
          </button>
        </div>
        <div class="modal-profile">
          <span class="modal-profile-avatar" data-delete-avatar></span>
          <span class="modal-profile-name" data-delete-name></span>
        </div>
        <p class="modal-copy">
          This permanently deletes this profile and its browsing data, vault, node data, and keys.
          This cannot be undone.
        </p>
        <div class="modal-actions">
          <button type="button" class="secondary-btn" data-delete-cancel>Cancel</button>
          <button type="button" class="primary-btn danger" data-delete-confirm>
            Delete Profile
          </button>
        </div>
      </div>
    </div>

    <div class="profile-toast" id="profile-toast" role="status" aria-live="polite" hidden></div>

    <!-- Shared hover tooltip for internal pages; exposes window.bindHoverTooltip
         / window.hideHoverTooltip. Loaded before scripts/profiles.js below so they
         are defined when card rendering binds them. -->
    <script src="scripts/hover-tooltip.js"></script>
    <script src="scripts/profiles.js"></script>
  </body>
</html>
