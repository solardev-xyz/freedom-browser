<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>History</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family:
          'IBM Plex Sans',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: var(--page-gradient);
        color: var(--text);
        padding: 48px;
        box-sizing: border-box;
        min-height: 100vh;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 8px;
        color: var(--accent);
        font-weight: 600;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .subtitle {
        color: var(--text-muted);
        margin-bottom: 24px;
        font-size: 14px;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        align-items: center;
      }
      .search-input {
        flex: 1;
        max-width: 400px;
        padding: 10px 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s;
      }
      .search-input:focus {
        border-color: var(--accent);
      }
      .search-input::placeholder {
        color: var(--text-subtle);
      }
      .btn {
        padding: 10px 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn:hover {
        background: var(--bg-raised);
        border-color: var(--border-strong);
      }
      .btn.danger {
        color: var(--danger);
      }
      .btn.danger:hover {
        border-color: var(--danger);
        background: var(--danger-bg);
      }
      .history-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .history-item {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 16px;
        background: var(--surface-translucent);
        border: 1px solid transparent;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .history-item:hover {
        background: var(--bg-card);
        border-color: var(--border);
      }
      .history-item:active {
        background: var(--bg-raised);
      }
      .favicon-container {
        position: relative;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .favicon {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        object-fit: contain;
        background: var(--bg-card-hover);
      }
      .favicon-placeholder {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        background: var(--bg-card-hover);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: var(--text-subtle);
      }
      /* Protocol icon shown when no favicon */
      .protocol-icon-full {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .protocol-icon-full.swarm {
        background: #f0883e33;
        color: #f0883e;
      }
      .protocol-icon-full.ipfs {
        background: #3fb95033;
        color: #3fb950;
      }
      .protocol-icon-full.ipns {
        background: #3fb95033;
        color: #3fb950;
      }
      .protocol-icon-full.onchain {
        background: #8c8cff33;
        color: #a8a8ff;
      }
      .protocol-icon-full.ens {
        background: #a371f733;
        color: #a371f7;
      }
      .protocol-icon-full.https {
        background: #388bfd33;
        color: #58a6ff;
      }
      .protocol-icon-full.http {
        background: #6e768133;
        color: #8b949e;
      }
      .protocol-icon-full.unknown {
        background: #6e768133;
        color: #8b949e;
      }
      /* Small badge overlay (only for non-HTTP with favicon) */
      .protocol-badge {
        position: absolute;
        bottom: -2px;
        right: -2px;
        font-size: 8px;
        padding: 1px 4px;
        border-radius: 3px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        border: 1px solid var(--bg);
        display: none;
      }
      .protocol-badge.show {
        display: block;
      }
      .protocol-badge.swarm {
        background: #f0883e;
        color: #0d1117;
      }
      .protocol-badge.ipfs {
        background: #3fb950;
        color: #0d1117;
      }
      .protocol-badge.ipns {
        background: #3fb950;
        color: #0d1117;
      }
      .protocol-badge.ens {
        background: #a371f7;
        color: #0d1117;
      }
      .history-content {
        flex: 1;
        min-width: 0;
      }
      .history-title {
        font-size: 14px;
        color: var(--text-strong);
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .history-url {
        font-size: 12px;
        color: var(--accent);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .history-meta {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-shrink: 0;
        color: var(--text-meta);
        font-size: 12px;
      }
      .history-time {
        min-width: 100px;
        text-align: right;
      }
      .history-visits {
        min-width: 60px;
        text-align: right;
      }
      .delete-btn {
        opacity: 0;
        padding: 6px;
        background: transparent;
        border: none;
        border-radius: 4px;
        color: var(--text-meta);
        cursor: pointer;
        transition: all 0.15s;
      }
      .history-item:hover .delete-btn {
        opacity: 1;
      }
      .delete-btn:hover {
        color: var(--danger);
        background: var(--danger-bg);
      }
      .empty-state {
        text-align: center;
        padding: 64px;
        color: var(--text-meta);
      }
      .empty-state svg {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
        opacity: 0.5;
      }
      .empty-state p {
        margin: 0;
        font-size: 14px;
      }
      .loading {
        text-align: center;
        padding: 64px;
        color: var(--text-meta);
      }
      .stats {
        color: #6e7681;
        font-size: 13px;
      }
      /* Sort dropdown */
      .sort-select {
        padding: 10px 32px 10px 16px;
        background: var(--bg-card) var(--select-chevron) no-repeat right 12px center;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        outline: none;
        transition: border-color 0.15s;
      }
      .sort-select:focus {
        border-color: var(--accent);
      }
      .sort-select:hover {
        background-color: var(--bg-raised);
        border-color: var(--border-strong);
      }
      /* Date group headers */
      .date-group {
        margin-bottom: 24px;
      }
      .date-group:last-child {
        margin-bottom: 0;
      }
      .date-header {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 8px;
        padding: 0 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .date-header::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .toolbar-right {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <h1>
      <svg
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      Browsing History
    </h1>
    <p class="subtitle" id="stats">Loading…</p>

    <div class="toolbar">
      <input
        type="text"
        class="search-input"
        id="search-input"
        placeholder="Search history…"
        autofocus
      />
      <div class="toolbar-right">
        <select class="sort-select" id="sort-select">
          <option value="recent">Most Recent</option>
          <option value="visited">Most Visited</option>
          <option value="title">A-Z by Title</option>
        </select>
        <button class="btn danger" id="clear-btn">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="3 6 5 6 21 6"></polyline>
            <path
              d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
            ></path>
          </svg>
          Clear All
        </button>
      </div>
    </div>

    <div id="history-container">
      <div class="loading">Loading history…</div>
    </div>

    <script src="scripts/history.js"></script>
  </body>
</html>
