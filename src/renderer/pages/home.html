<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <link rel="stylesheet" href="styles/theme.css" />
    <style>
      html {
        height: 100%;
      }
      /* min-height lets the artwork cover a page that scrolls (narrow windows). */
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 48px;
        box-sizing: border-box;
        position: relative;
      }

      body {
        background: var(--shell-bg);
        color: var(--shell-text);
      }
      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('images/home.png') no-repeat center center;
        background-size: cover;
        opacity: 0.6;
        z-index: -1;
      }
      h1 {
        font-size: 32px;
        margin-bottom: 16px;
      }
      p {
        max-width: 640px;
        line-height: 1.6;
        margin-bottom: 12px;
      }
      h2 {
        font-size: 18px;
        margin-top: 32px;
        margin-bottom: 12px;
        color: var(--shell-subtle);
      }
      code {
        background: var(--shell-code);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 13px;
      }
      ul {
        margin: 0;
        padding-left: 20px;
        line-height: 1.8;
      }
      li {
        margin-bottom: 4px;
      }
      a.protocol-link {
        color: var(--shell-link-home);
        text-decoration: none;
        background: var(--shell-code);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      a.protocol-link:hover {
        background: var(--shell-link-home-bg-hover);
        color: var(--shell-link-home-hover);
      }
      .logo-dark {
        display: var(--dark-only-display);
      }
      .logo-light {
        display: var(--light-only-display);
      }

      /* Agent setup banner. Built like the chrome's update toast
         (styles/update-toast.css): one solid card, one filled action, a close
         button. Solid, not glass, so its text reads the same over any part of
         the artwork. */
      .setup-banner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        max-width: 660px;
        box-sizing: border-box;
        margin-top: 32px;
        padding: 12px 12px 12px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg-elev);
        box-shadow: 0 4px 20px var(--home-card-shadow);
        color: var(--text);
        font-size: 13px;
        line-height: 1.45;
      }
      .setup-banner[hidden] {
        display: none;
      }
      .setup-banner-copy {
        flex: 1 1 240px;
        min-width: 0;
      }
      .setup-banner-title {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-strong);
      }
      .setup-banner-title:focus {
        outline: none;
      }
      /* Looks like Settings' Beta badge (.resolver-badge). The line box is
         trimmed to the letters (cap height to baseline), so the same padding
         above and below centres them whatever the system font's ascent and
         descent are; padding tuned to one font's metrics is off in another. */
      .setup-banner-tag {
        padding: 5px 7px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 11px;
        font-weight: 400;
        line-height: 1;
        text-box: trim-both cap alphabetic;
        color: var(--text-muted);
      }
      .setup-banner-byline {
        max-width: none;
        margin: 2px 0 0;
        color: var(--text-muted);
      }
      .setup-banner-actions {
        display: flex;
        flex: none;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }
      .setup-banner-action {
        padding: 6px 12px;
        border-radius: 6px;
        background: var(--accent);
        color: var(--bg);
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        transition: opacity 0.2s;
      }
      .setup-banner-action:hover {
        opacity: 0.9;
      }
      .setup-banner-dismiss {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--text-muted);
        font: inherit;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }
      .setup-banner-dismiss:hover {
        background-color: var(--home-control-hover);
        color: var(--text);
      }
      .setup-banner-dismiss:disabled {
        cursor: default;
        opacity: 0.5;
      }
      .setup-banner-action:focus-visible,
      .setup-banner-dismiss:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .setup-banner-status {
        flex-basis: 100%;
        max-width: none;
        margin: 0;
        font-size: 12.5px;
        color: var(--danger);
      }
      .setup-banner-status:empty {
        display: none;
      }
      @media (max-width: 560px) {
        body {
          padding: 32px 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .setup-banner * {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <img
      class="logo-dark"
      src="images/freedom-logo-white.svg"
      alt="Freedom"
      style="height: 48px; margin-bottom: 24px"
    />
    <img
      class="logo-light"
      src="images/freedom-logo-black.svg"
      alt="Freedom"
      style="height: 48px; margin-bottom: 24px"
    />
    <p id="home-intro" tabindex="-1">
      The decentralized web is here. Powered by built-in nodes, this browser connects you directly
      to peers, keeping the network strong and user-controlled.
    </p>
    <aside class="setup-banner" id="ai-invitation" aria-labelledby="ai-invitation-title" hidden>
      <div class="setup-banner-copy">
        <h2 class="setup-banner-title" id="ai-invitation-title" tabindex="-1">
          <span id="ai-invitation-heading">Meet Freedom Agent</span>
          <span class="setup-banner-tag">Beta</span>
        </h2>
        <p class="setup-banner-byline" id="ai-invitation-byline">Research, build and publish to the decentralized web.</p>
      </div>
      <div class="setup-banner-actions">
        <a class="setup-banner-action" id="ai-invitation-open" href="freedom://settings/ai">Set up</a>
        <button class="setup-banner-dismiss" id="ai-invitation-dismiss" type="button" aria-label="Hide the Freedom Agent banner" title="Hide">×</button>
      </div>
      <p class="setup-banner-status" id="ai-invitation-status" role="status"></p>
    </aside>
    <script src="scripts/home-ai.js"></script>
  </body>
</html>
