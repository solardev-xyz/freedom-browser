<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self';"
    />
    <link rel="stylesheet" href="styles/theme.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 48px;
        box-sizing: border-box;
        position: relative;
      }

      body {
        background: var(--shell-bg);
        color: var(--shell-text);
      }
      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('images/home.png') no-repeat center center;
        background-size: cover;
        opacity: 0.6;
        z-index: -1;
      }
      h1 {
        font-size: 32px;
        margin-bottom: 16px;
      }
      p {
        max-width: 640px;
        line-height: 1.6;
        margin-bottom: 12px;
      }
      h2 {
        font-size: 18px;
        margin-top: 32px;
        margin-bottom: 12px;
        color: var(--shell-subtle);
      }
      code {
        background: var(--shell-code);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 13px;
      }
      ul {
        margin: 0;
        padding-left: 20px;
        line-height: 1.8;
      }
      li {
        margin-bottom: 4px;
      }
      a.protocol-link {
        color: var(--shell-link-home);
        text-decoration: none;
        background: var(--shell-code);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      a.protocol-link:hover {
        background: var(--shell-link-home-bg-hover);
        color: var(--shell-link-home-hover);
      }
      .logo-dark {
        display: var(--dark-only-display);
      }
      .logo-light {
        display: var(--light-only-display);
      }
    </style>
  </head>
  <body>
    <img
      class="logo-dark"
      src="images/freedom-logo-white.svg"
      alt="Freedom"
      style="height: 48px; margin-bottom: 24px"
    />
    <img
      class="logo-light"
      src="images/freedom-logo-black.svg"
      alt="Freedom"
      style="height: 48px; margin-bottom: 24px"
    />
    <p>
      The decentralized web is here. Powered by built-in nodes, this browser connects you directly
      to peers, keeping the network strong and user-controlled.
    </p>
  </body>
</html>
