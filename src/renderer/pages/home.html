<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <link rel="stylesheet" href="styles/theme.css" />
    <style>
      html {
        height: 100%;
      }
      /* min-height lets the artwork cover a page that scrolls (narrow windows). */
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 48px;
        box-sizing: border-box;
        position: relative;
      }

      body {
        background: var(--shell-bg);
        color: var(--shell-text);
      }
      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('images/home.png') no-repeat center center;
        background-size: cover;
        opacity: 0.6;
        z-index: -1;
      }
      h1 {
        font-size: 32px;
        margin-bottom: 16px;
      }
      p {
        max-width: 640px;
        line-height: 1.6;
        margin-bottom: 12px;
      }
      h2 {
        font-size: 18px;
        margin-top: 32px;
        margin-bottom: 12px;
        color: var(--shell-subtle);
      }
      code {
        background: var(--shell-code);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 13px;
      }
      ul {
        margin: 0;
        padding-left: 20px;
        line-height: 1.8;
      }
      li {
        margin-bottom: 4px;
      }
      a.protocol-link {
        color: var(--shell-link-home);
        text-decoration: none;
        background: var(--shell-code);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      a.protocol-link:hover {
        background: var(--shell-link-home-bg-hover);
        color: var(--shell-link-home-hover);
      }
      .logo-dark {
        display: var(--dark-only-display);
      }
      .logo-light {
        display: var(--light-only-display);
      }

      /* What's new: a compact list of glass rows, one line each. Rows paint
         flat translucent colour only, so text contrast is measurable. */
      .whats-new {
        container: whats-new / inline-size;
        max-width: 660px;
        margin-top: 32px;
      }
      .whats-new[hidden],
      .whats-new [hidden] {
        display: none;
      }
      .whats-new svg {
        flex: none;
      }
      .whats-new-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .whats-new-header h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--shell-heading);
      }
      .whats-new-header h2:focus {
        outline: none;
      }
      .whats-new-header h2:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
        border-radius: 4px;
      }
      .whats-new-header h2 svg {
        color: var(--home-teal);
      }
      .whats-new-rule {
        flex: 1;
        height: 1px;
        background-image: linear-gradient(90deg, var(--home-card-border-hover), transparent);
      }

      .whats-new-list {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
        line-height: 1.4;
      }
      .whats-new-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        margin: 0;
        border: 1px solid var(--home-card-border);
        border-radius: 14px;
        background-color: var(--home-card);
        /* Static glass over the static artwork; nothing animates the blur. */
        backdrop-filter: blur(14px) saturate(1.2);
        box-shadow:
          inset 0 1px 0 var(--home-card-sheen),
          0 14px 30px -24px var(--home-card-shadow);
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease;
      }
      .whats-new-row:hover,
      .whats-new-row:focus-within {
        border-color: var(--home-card-border-hover);
        background-color: var(--home-card-hover);
      }
      .whats-new-link {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 12px;
        min-width: 0;
        min-height: 52px;
        box-sizing: border-box;
        padding: 12px 16px 12px 12px;
        border-radius: 13px;
        color: var(--shell-heading);
        text-decoration: none;
      }
      .whats-new-link:focus-visible,
      .whats-new-dismiss:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .whats-new-icon {
        display: grid;
        flex: none;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        box-shadow: inset 0 0 0 1px var(--home-card-border);
        color: var(--shell-body);
        background-color: var(--home-inset);
      }
      .whats-new-icon-agent {
        color: var(--home-teal);
        background-color: var(--home-teal-soft);
      }
      .whats-new-copy {
        flex: 1;
        min-width: 0;
      }
      .whats-new-label {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .whats-new-byline {
        display: block;
        margin-top: 3px;
        font-size: 13px;
        line-height: 1.45;
        color: var(--shell-muted);
      }
      .whats-new-title {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: -0.005em;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .whats-new-tag {
        flex: none;
        padding: 1px 7px;
        border: 1px solid var(--home-card-border-hover);
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--shell-muted);
      }
      .whats-new-state {
        flex: none;
        margin-left: auto;
        padding: 2px 10px;
        border: 1px solid var(--home-card-border);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        color: var(--shell-body);
        background-color: var(--home-inset);
      }
      .whats-new-state:empty {
        display: none;
      }
      .whats-new-state[data-enabled='true'] {
        color: var(--home-teal);
        background-color: var(--home-teal-soft);
      }
      .whats-new-chevron {
        color: var(--shell-muted);
        transition: transform 0.18s ease;
      }
      /* Right-align the chevron when nothing before it takes the free space. */
      .whats-new-state:empty + .whats-new-chevron {
        margin-left: auto;
      }
      .whats-new-link:hover .whats-new-chevron {
        transform: translateX(2px);
      }
      .whats-new-dismiss {
        display: grid;
        flex: none;
        place-items: center;
        width: 30px;
        height: 30px;
        margin-right: 10px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background-color: transparent;
        color: var(--shell-muted);
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }
      .whats-new-dismiss:hover {
        background-color: var(--home-control-hover);
        color: var(--shell-heading);
      }
      .whats-new-dismiss:disabled {
        cursor: default;
        opacity: 0.5;
      }
      .whats-new-status {
        flex-basis: 100%;
        max-width: none;
        margin: 0;
        padding: 0 16px 12px 54px;
        font-size: 12.5px;
        color: var(--shell-danger);
      }
      .whats-new-status:empty {
        display: none;
      }

      @container whats-new (max-width: 460px) {
        .whats-new-row {
          align-items: flex-start;
        }
        .whats-new-link {
          flex-wrap: wrap;
        }
        .whats-new-copy {
          display: contents;
        }
        .whats-new-label {
          flex: 1;
          min-width: 0;
        }
        .whats-new-byline {
          order: 1;
          flex-basis: 100%;
          margin-top: 0;
        }
        .whats-new-dismiss {
          margin-top: 12px;
        }
      }
      @container whats-new (max-width: 340px) {
        .whats-new-tag {
          display: none;
        }
        .whats-new-link {
          gap: 8px;
          padding-right: 10px;
        }
      }
      @media (max-width: 560px) {
        body {
          padding: 32px 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .whats-new *,
        .whats-new *::before,
        .whats-new *::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <img
      class="logo-dark"
      src="images/freedom-logo-white.svg"
      alt="Freedom"
      style="height: 48px; margin-bottom: 24px"
    />
    <img
      class="logo-light"
      src="images/freedom-logo-black.svg"
      alt="Freedom"
      style="height: 48px; margin-bottom: 24px"
    />
    <p id="home-intro" tabindex="-1">
      The decentralized web is here. Powered by built-in nodes, this browser connects you directly
      to peers, keeping the network strong and user-controlled.
    </p>
    <section class="whats-new" id="whats-new" aria-labelledby="whats-new-title" hidden>
      <header class="whats-new-header">
        <h2 id="whats-new-title" tabindex="-1">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.7 5.2 4.1 8.6 9.5 9.5-5.4.9-8.8 4.3-9.5 9.5-.7-5.2-4.1-8.6-9.5-9.5 5.4-.9 8.8-4.3 9.5-9.5z" /></svg>
          What’s new
        </h2>
        <span class="whats-new-rule" aria-hidden="true"></span>
      </header>
      <ul class="whats-new-list">
        <li class="whats-new-row" id="ai-invitation" hidden>
          <a class="whats-new-link" id="ai-invitation-open" href="freedom://settings/ai">
            <span class="whats-new-icon whats-new-icon-agent" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.7 5.2 4.1 8.6 9.5 9.5-5.4.9-8.8 4.3-9.5 9.5-.7-5.2-4.1-8.6-9.5-9.5 5.4-.9 8.8-4.3 9.5-9.5z" /></svg></span>
            <span class="whats-new-copy">
              <span class="whats-new-label">
                <span class="whats-new-title">Freedom Agent</span>
                <span class="whats-new-tag">Beta</span>
              </span>
              <span class="whats-new-byline">Research, build and publish to the decentralized web with Freedom Agent.</span>
            </span>
            <span class="whats-new-state" id="ai-invitation-state"></span>
            <svg class="whats-new-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
          </a>
          <button class="whats-new-dismiss" id="ai-invitation-dismiss" type="button" aria-label="Hide Freedom Agent from What’s new" title="Hide from What’s new">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
          <p class="whats-new-status" id="ai-invitation-status" role="status"></p>
        </li>
      </ul>
    </section>
    <script src="scripts/home-ai.js"></script>
  </body>
</html>
