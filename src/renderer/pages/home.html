<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <link rel="stylesheet" href="styles/theme.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 48px;
        box-sizing: border-box;
        position: relative;
      }

      body {
        background: var(--shell-bg);
        color: var(--shell-text);
      }
      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('images/home.png') no-repeat center center;
        background-size: cover;
        opacity: 0.6;
        z-index: -1;
      }
      h1 {
        font-size: 32px;
        margin-bottom: 16px;
      }
      p {
        max-width: 640px;
        line-height: 1.6;
        margin-bottom: 12px;
      }
      h2 {
        font-size: 18px;
        margin-top: 32px;
        margin-bottom: 12px;
        color: var(--shell-subtle);
      }
      code {
        background: var(--shell-code);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 13px;
      }
      ul {
        margin: 0;
        padding-left: 20px;
        line-height: 1.8;
      }
      li {
        margin-bottom: 4px;
      }
      a.protocol-link {
        color: var(--shell-link-home);
        text-decoration: none;
        background: var(--shell-code);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'SF Mono', Menlo, monospace;
        font-size: 13px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      a.protocol-link:hover {
        background: var(--shell-link-home-bg-hover);
        color: var(--shell-link-home-hover);
      }
      .logo-dark {
        display: var(--dark-only-display);
      }
      .logo-light {
        display: var(--light-only-display);
      }
      .ai-invitation { display: flex; align-items: center; gap: 18px; max-width: 620px; margin-top: 36px; padding: 20px; border: 1px solid var(--border); border-radius: 16px; background: var(--panel-translucent); color: var(--text); }
      .ai-invitation[hidden] { display: none; }
      .ai-invitation-copy { flex: 1; min-width: 0; }
      .ai-invitation h2 { font-size: 16px; margin: 0 0 8px; }
      .ai-invitation p { font-size: 13px; margin: 0; color: var(--text-muted); }
      .ai-invitation-beta { font-size: 10px; font-weight: 500; border: 1px solid var(--border-strong); border-radius: 5px; padding: 2px 5px; margin-left: 5px; vertical-align: middle; }
      .ai-invitation a { color: var(--bg); background: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 9px 12px; font-size: 13px; text-decoration: none; white-space: nowrap; }
      .ai-invitation-dismiss { border: 0; background: transparent; color: var(--text-muted); font: inherit; font-size: 20px; padding: 4px 6px; cursor: pointer; }
      .ai-invitation a:focus-visible, .ai-invitation button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
      @media (max-width: 580px) { .ai-invitation { flex-wrap: wrap; gap: 12px; padding: 16px; } .ai-invitation-copy { flex-basis: calc(100% - 48px); } .ai-invitation a { order: 3; } }
    </style>
  </head>
  <body>
    <img
      class="logo-dark"
      src="images/freedom-logo-white.svg"
      alt="Freedom"
      style="height: 48px; margin-bottom: 24px"
    />
    <img
      class="logo-light"
      src="images/freedom-logo-black.svg"
      alt="Freedom"
      style="height: 48px; margin-bottom: 24px"
    />
    <p>
      The decentralized web is here. Powered by built-in nodes, this browser connects you directly
      to peers, keeping the network strong and user-controlled.
    </p>
    <aside class="ai-invitation" id="ai-invitation" aria-labelledby="ai-invitation-title" hidden>
      <div class="ai-invitation-copy"><h2 id="ai-invitation-title">Try AI in Freedom <span class="ai-invitation-beta">Beta</span></h2><p>Research, build and publish with Agent.</p><p id="ai-invitation-status" role="status"></p></div>
      <a href="freedom://settings/ai">Explore AI</a>
      <button class="ai-invitation-dismiss" id="ai-invitation-dismiss" type="button" aria-label="Dismiss AI invitation">×</button>
    </aside>
    <script src="scripts/home-ai.js"></script>
  </body>
</html>
