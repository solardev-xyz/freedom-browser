<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <!-- The error page must own its title. Without one, Chromium never fires
         `page-title-updated`, so the tab (and the window title) keep showing
         the title of whatever page the user was on before the failed
         navigation. See issue #236. `displayError()` keeps this in sync with
         the headline it picks for the specific failure. -->
    <title>Content unavailable</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <!-- The same frame as the name interstitials (#606 item 4): left-aligned
         640px column, an icon in the heading, a filled primary action. Only
         what is specific to this page stays inline. -->
    <link rel="stylesheet" href="styles/interstitial.css" />
    <style>
      .error-details {
        background: var(--shell-surface);
        border: 1px solid var(--shell-border-soft);
        padding: 12px 16px;
        border-radius: 8px;
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--shell-danger);
        margin-bottom: 20px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .auto-retry {
        font-size: 14px;
      }
      .nodes-icon {
        display: inline-block;
        width: 1.2em;
        height: 1.2em;
        vertical-align: middle;
        margin: 0 2px;
      }
    </style>
  </head>
  <body class="error">
    <div class="container">
      <h1>
        <svg
          class="shield"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="7" x2="12" y2="13" />
          <circle cx="12" cy="17" r="0.5" fill="currentColor" />
        </svg>
        <span id="title">Content unavailable</span>
      </h1>
      <p id="description">
        This content could not be retrieved from the decentralized network. The address may be
        invalid, the content may no longer exist, or no peers are serving it.
      </p>
      <div id="details" class="error-details"></div>
      <p id="auto-retry" class="auto-retry" hidden></p>
      <div class="buttons">
        <button id="retry-btn" class="button-primary">Try again</button>
        <button id="auto-retry-stop" hidden>Stop retrying</button>
      </div>
    </div>

    <script src="scripts/error.js"></script>
  </body>
</html>
