<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <!-- The error page must own its title. Without one, Chromium never fires
         `page-title-updated`, so the tab (and the window title) keep showing
         the title of whatever page the user was on before the failed
         navigation. See issue #236. `displayError()` keeps this in sync with
         the headline it picks for the specific failure. -->
    <title>Content unavailable</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--shell-gradient);
        color: var(--shell-heading-ink);
        padding: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-sizing: border-box;
      }
      .container {
        max-width: 600px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 16px;
        color: var(--shell-danger);
      }
      p {
        line-height: 1.6;
        margin-bottom: 24px;
        color: var(--shell-body);
      }
      .error-details {
        background: var(--shell-surface);
        padding: 16px;
        border-radius: 8px;
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--shell-danger);
        margin-bottom: 24px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      button {
        padding: 10px 20px;
        background: var(--shell-button);
        color: var(--shell-on-button);
        border: 1px solid var(--shell-border);
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      .auto-retry {
        font-size: 14px;
        margin: 0 0 16px;
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      button:hover {
        background: var(--shell-button-hover);
      }
      .nodes-icon {
        display: inline-block;
        width: 1.2em;
        height: 1.2em;
        vertical-align: middle;
        margin: 0 2px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="title">Content unavailable</h1>
      <p id="description">
        This content could not be retrieved from the decentralized network. The address may be
        invalid, the content may no longer exist, or no peers are serving it.
      </p>
      <div id="details" class="error-details"></div>
      <p id="auto-retry" class="auto-retry" hidden></p>
      <div class="actions">
        <button id="retry-btn">Try Again</button>
        <button id="auto-retry-stop" hidden>Stop retrying</button>
      </div>
    </div>

    <script src="scripts/error.js"></script>
  </body>
</html>
