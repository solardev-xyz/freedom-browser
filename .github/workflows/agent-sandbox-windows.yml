name: Windows junction fixture diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Probe owned junction fixtures with the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE) { throw 'Pinned Rust setup failed' }
          $source = @'
          use std::{env, fs, path::{Path,PathBuf}, process::Command};
          use std::os::windows::process::CommandExt;
          fn normal(p:&Path)->PathBuf {
              let text=p.to_string_lossy();
              PathBuf::from(text.strip_prefix(r"\\?\").unwrap_or(&text))
          }
          fn probe(label:&str,cmd:&Path,link:&Path,target:&Path,raw:bool) {
              let mut child=Command::new(cmd);
              if raw { child.raw_arg(format!(r#"/d /c mklink /J "{}" "{}""#,link.display(),target.display())); }
              else { child.args(["/d","/c","mklink","/J"]).arg(link).arg(target); }
              let output=child.output().unwrap();
              println!("{label}: cmd={cmd:?} link={link:?} target={target:?} status={:?} stdout={:?} stderr={:?}",
                  output.status.code(),String::from_utf8_lossy(&output.stdout),String::from_utf8_lossy(&output.stderr));
          }
          fn main() {
              let home=env::temp_dir().join(format!("freedom-junction-probe-{}",std::process::id()));
              fs::create_dir(&home).unwrap();
              let target=home.join("target"); fs::create_dir(&target).unwrap();
              println!("TEMP={:?} home={home:?} canonical={:?}",env::var_os("TEMP"),fs::canonicalize(&home));
              let root=PathBuf::from(env::var_os("SystemRoot").unwrap());
              let cmd=root.join("System32/cmd.exe");
              probe("args",&cmd,&home.join("link-args"),&target,false);
              probe("args-dangling",&cmd,&home.join("link-dangling"),&home.join("absent"),false);
              probe("raw",&cmd,&home.join("link-raw"),&target,true);
              let home=normal(&fs::canonicalize(&home).unwrap());
              probe("normalized-args",&root.join("System32").join("cmd.exe"),&home.join("link-normal"),&home.join("target"),false);
              println!("std-symlink={:?}",std::os::windows::fs::symlink_dir(home.join("target"),home.join("link-std")));
          }
          '@
          $probeSource = Join-Path $env:RUNNER_TEMP fixture-probe.rs
          $probeExe = Join-Path $env:RUNNER_TEMP fixture-probe.exe
          Set-Content -Path $probeSource -Value $source -Encoding utf8
          rustup run 1.95.0 rustc --edition=2024 $probeSource -o $probeExe
          if ($LASTEXITCODE) { throw 'Fixture probe compilation failed' }
          & $probeExe
          if ($LASTEXITCODE) { throw 'Fixture probe failed' }
