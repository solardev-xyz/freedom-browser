      - name: Install dependencies
        uses: ./.github/actions/install-node-deps

      - name: Install Electron system dependencies
        uses: ./.github/actions/install-playwright-deps

      - name: Run the external gateway proxy integration test
        env:
          FREEDOM_ELECTRON_NET_TEST: '1'
        run: npx jest src/main/__tests__/integration/ipfs-gateway-proxy.test.js

  # Tab activation, link dispositions and menu dismissal are all about *focus*
  # — which of the shell and the guest `<webview>` owns the keyboard — and no
  # unit test can see that: it is decided by the real Chromium focus tree.
  # These specs are the only place it is asserted, and they ran locally
  # only until a focus regression in one shipped green through the curated
  # list above (the `<webview>` holding focus after a tab switch swallowed the
  # Escape that dismisses the page context menu; caught by hand, not by CI).
  #
  # `menus.spec.js` and `bookmarks.spec.js` are here for the same reason: the
  # first asserts Escape hands focus back to the button that opened a menu
  # (#306), the second drives modified/middle clicks and a real HTML5 drag on
  # the bookmarks bar (#307) — dispositions and drag gestures a synthetic DOM
  # dispatch cannot exercise. `page-context-menu.spec.js` joins them for the
  # selection search item (#330), whose Ctrl/Cmd-click background disposition
  # is likewise invisible to a synthetic click.
  #
  # `chrome-popovers.spec.js` likewise needs the real thing: it resizes the
  # actual BrowserWindow and reads laid-out geometry (a menu's bottom edge, the
  # chrome document's scrollHeight, where a context menu lands relative to the
  # pointer), none of which a jsdom-less unit fake can produce (#324).
  #
  # `permissions.spec.js` belongs to the same family and was likewise in no
  # job's list: the anchored prompt is decided by real input and focus routing
  # (Escape and click-away as a deny-once, a background tab's prompt held
  # rather than dismissed, a modal <dialog> taking the Escape instead), and it
  # drives the indicator popover the dismissal embargo is surfaced and lifted
  # in — including the private-window scoping, which needs two real windows on
  # two real sessions (#364, #365). `external-protocol.spec.js` rides the same
  # prompt for magnet:/mailto: links (#406), and its user-gesture gate reads
  # real input events on the guest webContents — a scripted click must not
  # count, so only a real input path can prove it.
