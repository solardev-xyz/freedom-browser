  # --- Renderer visual guards (#261 item 1) ---------------------------------
  #
  # Both jobs below are gated on this one: they only have anything to say about
  # a change that touches the renderer, its harness, or the specs themselves,
  # and a screenshot job that runs on every backend-only PR is a job people
  # learn to ignore. On a push (not a PR) they always run, so `main` keeps the
  # baselines honest even when nobody opened a PR. Both read `!= 'false'`
  # behind `!cancelled()` for the same reason the `code-changed` consumers do
  # — see the note on that job: a gate that fails must run the suites, not
  # skip them into a reported Success.
  renderer-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      renderer: ${{ steps.filter.outputs.renderer }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the renderer changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "not a pull request — running the visual jobs"
            echo "renderer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE"
          changed=$(git diff --no-renames --name-only "origin/$BASE...HEAD")
          echo "$changed"
          # Everything the two visual jobs read, not just the renderer: the
          # specs, the fixtures, the gate that can turn them into no-ops, the
          # list of surfaces the screenshot spec declares (which decides which
          # baselines are taken and which count as stranded), *and the
          # baselines they compare against* — a baseline-adoption PR
          # (`node scripts/apply-screenshot-baselines.js <artifact>`) touches
          # only `__screenshots__/` or the contrast baseline, and skipping both
          # jobs on it would land the new pixels unchecked. `package.json` is in
          # the list because the npm scripts are how the jobs launch the specs.
          # No `-q`, for the same reason as the `code-changed` filter above:
          # `-q` exits at the first hit and a >64 KiB path list then kills the
          # `echo` with SIGPIPE, which `pipefail` turns into `renderer=false`.
          if echo "$changed" | grep -E '^(src/renderer/|test-e2e/(theme-parity|renderer-screenshots)\.spec\.js|test-e2e/(fixtures|packaged-launch|screenshot-gate|screenshot-baselines)\.js|test-e2e/theme-contrast-baseline\.json|test-e2e/__screenshots__/|package\.json|\.claude/skills/run-freedom/|playwright\.config\.js|\.github/workflows/ci\.yml)' >/dev/null; then
            echo "renderer=true" >> "$GITHUB_OUTPUT"
          else
            echo "renderer=false" >> "$GITHUB_OUTPUT"
          fi

  # Both themes, every surface the tour reaches: the declared theme plus WCAG
  # contrast on headings, body copy, buttons and inputs. This is the check that
  # fails on a reintroduced #224 (dark resolver rows under the light theme) or
  # #249 (white-on-white permission origin).
  e2e-theme-parity:
    needs: renderer-changed
    if: ${{ !cancelled() && needs.renderer-changed.outputs.renderer != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux native USB build dependency
        uses: ./.github/actions/install-linux-native-deps

      - name: Install dependencies
        uses: ./.github/actions/install-node-deps

      - name: Install Playwright system dependencies
        uses: ./.github/actions/install-playwright-deps

      - name: Run theme parity E2E
        run: xvfb-run -a npm run test:e2e -- test-e2e/theme-parity.spec.js

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-theme-parity-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Committed pixel baselines for the tour's surfaces, both themes. Ubuntu only:
  # font rasterisation differs enough between platforms that a macOS or Windows
  # leg would disagree with every baseline (the spec skips itself off Linux).
  #
  # When this fails, download the `renderer-screenshots-diff` artifact — it
  # carries `<name>-actual.png` and `<name>-diff.png` per surface — and either
  # fix the regression or adopt the new pixels with
  # `node scripts/apply-screenshot-baselines.js <unzipped-artifact>`.
  # Locally: `xvfb-run -a npm run test:e2e:screenshots:update`.
  e2e-renderer-screenshots:
    needs: renderer-changed
    if: ${{ !cancelled() && needs.renderer-changed.outputs.renderer != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux native USB build dependency
        uses: ./.github/actions/install-linux-native-deps

      - name: Install dependencies
        uses: ./.github/actions/install-node-deps

      - name: Install Playwright system dependencies
        uses: ./.github/actions/install-playwright-deps

      - name: Compare renderer screenshots
        run: xvfb-run -a npm run test:e2e:screenshots

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-screenshots-diff
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # The single check branch protection should require. A skipped job does not
  # leave a required context pending — it reports Success — which is exactly
  # why naming the individual contexts is the weaker arrangement: on a
  # docs-only pull request nine of today's ten required contexts pass without
  # running, and nothing in that set can see the gate job's own result. This
  # job can: it waits on every job in the workflow, `code-changed` and
  # `renderer-changed` included, and goes red the moment any of them fails or
  # is cancelled, whatever the gates decided to skip.
  ci-ok:
    if: always()
    needs:
      [
        code-changed,
        e2e-address-bar-clipboard,
        e2e-address-bar-ens,
        e2e-ant,
        e2e-chrome-webstore,
        e2e-close-tab-shortcut,
        e2e-ipfs-quit,
        e2e-onboarding-identity,
        e2e-profiles,
        e2e-renderer-screenshots,
        e2e-settings,
        e2e-shortcuts-zoom,
        e2e-tabs,
        e2e-theme-parity,
        freedom-ipfs-native-addon,
        ipfs-gateway-proxy,
        migration-cross-platform,
        myotis-addon-load,
        myotis-native-e2e,
        radicle-addon-load,
        renderer-changed,
        test,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report whether every job that ran succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "a required job did not pass"
              exit 1
            fi
          done
          echo "all jobs passed or were skipped"
