name: CI

on:
  push:
    # A same-repo branch push and the `pull_request` event for the same head
    # are two separate runs of this workflow — `github.ref` differs
    # (`refs/heads/<branch>` against `refs/pull/N/merge`), so the `concurrency`
    # group below does not collapse them — and both gate jobs short-circuit to
    # true on anything that is not a pull request. An unfiltered `push:`
    # therefore ran the whole matrix on every *feature* branch push alongside
    # the pull request run, gate or no gate, and that duplicate is what this
    # filter drops.
    #
    # What it must not drop is a ref that takes commits with no pull request
    # of its own. `main` and the release tags are the obvious two.
    # `release/**` and `hotfix/**` are the third: `release-process.md` §1 puts
    # each `npm version <x>-rc.N` bump straight onto the release branch and §8
    # expects same-cycle `fix(build): …` commits there, and even the fixes that
    # do arrive as pull requests (§0) land as a merge commit whose tree no
    # `pull_request` run ever saw. §4 then gates the pre-tag "CI is green"
    # check on exactly these runs — "every push to the release branch runs the
    # full CI matrix", read off the Actions tab, since §8 makes the pull
    # request into `main` optional and there is often no `gh pr checks` to ask.
    # Counted 2026-09-22 over the runs still in Actions retention,
    # release/0.8.5 took 13 of these runs and release/0.8.0 took 8. Dropping
    # them would leave `release.yml` — which does not gate on CI —
    # publishing a tagged pre-release to testers while the first CI signal
    # for that tree was still running.
    #
    # `scripts/ci/ci-gate.test.js` pins this by matching real branch names
    # against the list rather than the list's text, so a rename of the release
    # convention has to update both.
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
    tags: ['v*']
  pull_request:
  # A merge queue is not a workflow-free settings change, which is what the
  # `branches:` filter above turns it into. A queue pushes its candidate head
  # to `gh-readonly-queue/<base>/pr-<n>-<sha>`, and that name matches none of
  # the patterns above — deliberately, since a queue branch is machinery, not
  # a ref anyone develops on. Without this trigger the queue head would get no
  # run of this workflow at all, so `ci-ok` (and every other context) would
  # never report on it and every queued pull request would sit waiting for
  # checks that cannot arrive until the queue's own timeout evicted it.
  #
  # Both gates short-circuit to "changed" on any event that is not a
  # `pull_request`, so a queue run is never classified as prose and always
  # runs the full matrix — which is the right answer for a merged-result
  # check, and is what `$EVENT != "pull_request"` already gives it. Pinned in
  # `scripts/ci/ci-gate.test.js` along with the rest of the trigger set.
  merge_group:
  workflow_dispatch:
    inputs:
      myotis_live:
        description: 'Run real Myotis reads on all platforms (requires fresh checkpoints; never accepts stale-anchor risk)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Feature-branch supersession is useful, but main's long native network
  # proof must be allowed to finish even if another merge lands meanwhile.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Is there anything in this pull request that the *gated* suites below could
  # possibly be testing? A changelog fragment, a playbook or a doc cannot
  # change what the app does, and re-running 40 Playwright, native-addon and
  # cross-platform jobs to prove that costs 10-14 minutes per push. Anything
  # else, including an unrecognised path, runs the full suite: the filter
  # defaults to "code changed", never the other way round.
  #
  # What that does and does not buy: the filter reads the pull request's whole
  # diff against its base, so it fires only on a pull request that is prose all
  # the way down. A code pull request still runs everything on every push, an
  # update-branch commit included — so this job does nothing for a four-PR
  # merge train of code changes; what shortened that is `changelog.d/`
  # fragments no longer manufacturing a conflict per merge. What this job buys
  # is the prose-only pull request: about two minutes instead of 10-14.
  #
  # That default has to survive this job *failing* too, which is why every
  # gated job below reads `!= 'false'` behind `!cancelled()` rather than the
  # obvious `== 'true'`. A job skipped by its own `if`, or skipped because a
  # job it `needs` failed, reports **Success** to branch protection — only a
  # whole workflow skipped by a path/branch filter sits pending. So with
  # `== 'true'`, a `code-changed` that died on a transient `checkout`/`git
  # fetch` error or a lost runner would skip all sixteen suites and hand the
  # pull request a green merge button with no Playwright, native-addon or
  # cross-platform job having run. `!= 'false'` fails open instead: a gate
  # that never wrote `code=` leaves the output empty and everything runs;
  # only a gate that positively concluded "prose only" skips anything.
  # `!cancelled()` rather than `always()` so `cancel-in-progress` still
  # cancels the suites. `scripts/ci/ci-gate.test.js` pins the shape, because
  # a copy-pasted `== 'true'` on the next gated job reopens this silently.
  #
  # The `test` job is deliberately *not* gated on this one, because prose is
  # not inert here — it is an input to the jest suite. This repo's doc<->code
  # guards read the very files this filter calls prose: `docs/features.md`
  # (`src/shared/shortcuts.test.js`'s shortcut-registry guard and
  # `settings-search.test.js`), `CHANGELOG.md` (`settings-search.test.js`),
  # `docs/agent-playbooks/ui-consistency.md` (`renderer-copy.test.js`),
  # `docs/audits/evidence/` (`checkpoint-verifier-worker.test.js`) — and two
  # `*.test.js` files live under `docs/` outright, where jest's `**/*.test.js`
  # picks them up and `eslint .` lints them. Skipping `test` on a docs-only
  # pull request would let exactly the drift those guards exist to catch merge
  # green and leave `main` red for the next PR. It is the cheap job anyway
  # (~100s against 10-14 minutes), and `scripts/ci/ci-gate.test.js` pins that
  # it stays ungated for as long as the jest suite reads prose.
  code-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether anything outside the docs changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "not a pull request — running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE"
          changed=$(git diff --no-renames --name-only "origin/$BASE...HEAD")
          echo "$changed"
          # Prose only: the changelog and its fragments, docs/, and the
          # top-level markdown. One path outside that list is enough to run
          # the full suite.
          # `grep` drains its input and its output is discarded, rather than
          # `grep -q`: `-q` exits at the first hit, and once `$changed`
          # outgrows the 64 KiB pipe buffer the still-writing `echo` dies of
          # SIGPIPE, `set -o pipefail` makes the pipeline 141 and the `else`
          # branch writes `code=false` for a pull request whose first changed
          # path was code. That is the one shape the fail-open `if` on the
          # gated jobs cannot cover, since the gate positively concluded.
          if echo "$changed" | grep -vE '^(CHANGELOG\.md|changelog\.d/|docs/|[A-Z_]+\.md$)' >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Lint plus the whole jest suite, doc<->code guards included — which is why
  # this is the one suite `code-changed` does not gate. See the note there.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        uses: ./.github/actions/install-node-deps
        with:
          ignore-scripts: 'true'

      - name: Run lint
        run: npm run lint

      - name: Run test coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  # v0.8.0 upgrade / profile-migration coverage on all three desktop platforms.
  # The bee->ant carry has OS-specific filesystem semantics (Windows EPERM on
  # locked handles, rename-vs-copy fallbacks), so the migration + profile
  # resolver/paths suites must be green on Windows and macOS too — not just the
  # ubuntu-only `test` job. Pure jest, no display or native nodes required.
  migration-cross-platform:
    needs: code-changed
    if: ${{ !cancelled() && needs.code-changed.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        uses: ./.github/actions/install-node-deps
        with:
          ignore-scripts: 'true'

      - name: Run migration + profile suites
        run: npm run test:migration

  # freedom-ipfs native addon smoke for every desktop addon target currently
  # published in the pinned prebuilt manifest. This downloads the real release
  # artifact, loads it in Node, starts native freedom-ipfs, and retrieves a real
  # IPNS page through the native request API.
  freedom-ipfs-native-addon:
    needs: code-changed
    if: ${{ !cancelled() && needs.code-changed.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        uses: ./.github/actions/install-node-deps
        with:
          ignore-scripts: 'true'

      - name: Assert shipped native-addon target
        run: node -e "const target = process.platform + '-' + process.arch; const expected = process.env.EXPECTED_TARGET; if (target !== expected) { console.error('Expected ' + expected + ' runner, got ' + target); process.exit(1); } console.log(target);"
        env:
          EXPECTED_TARGET: ${{ matrix.target }}

      - name: Download IPFS native addon
        run: npm run ipfs:download
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Smoke test IPFS native addon
        run: npm run ipfs:native:smoke
        env:
          FREEDOM_IPFS_NATIVE_SMOKE_TARGET: ${{ matrix.target }}
          FREEDOM_IPFS_NATIVE_SMOKE_PATH: /ipns/ipfs.tech/
          FREEDOM_IPFS_NATIVE_SMOKE_EXPECT: ipfs

      - name: Smoke test issue #102 high-fanout IPFS page
        if: matrix.target == 'linux-x64'
        run: npm run ipfs:native:smoke
        env:
          FREEDOM_IPFS_NATIVE_SMOKE_TARGET: ${{ matrix.target }}
          FREEDOM_IPFS_NATIVE_SMOKE_LIVE: '0'
          FREEDOM_IPFS_NATIVE_SMOKE_ISSUE_102: '1'

  # libradicle is the ONLY Radicle runtime — there is no executable fallback —
  # so every release asset has to download, verify against the in-repo pinned
  # checksums, load, and answer a native call on the platform it ships for.
  # Modelled on myotis-addon-load. win-arm64 has no hosted runner: it is
  # downloaded and checksum-verified on windows-latest (a foreign-arch library
  # cannot be dlopen'ed), which is what catches a missing or re-published asset.
  radicle-addon-load:
    needs: code-changed
    if: ${{ !cancelled() && needs.code-changed.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
            flags: --mac --arm64
          - os: macos-15-intel
            target: mac-x64
            flags: --mac --x64
          - os: ubuntu-latest
            target: linux-x64
            flags: --linux --x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            flags: --linux --arm64
          - os: windows-latest
            target: win-x64
            flags: --win --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        uses: ./.github/actions/install-node-deps
        with:
          ignore-scripts: 'true'

      - name: Download this runner's libradicle addon
        run: npm run radicle:download -- ${{ matrix.flags }}

      - name: Load addon and verify exports
        run: node scripts/check-radicle-addon.js radicle-bin/${{ matrix.target }}/libradicle.node

      # No hosted arm64 Windows runner exists, so the asset is at least proven
      # to be published and to match the pinned SHA256SUMS.
      - name: Verify the win-arm64 release asset
        if: matrix.target == 'win-x64'
        run: npm run radicle:download -- --win --arm64

  # Load every native Myotis addon target that release packaging requires.
  # The live network proof below remains one representative architecture per
  # shipped OS; this fast matrix closes the packaging gap for Intel macOS and
  # ARM64 Linux without multiplying the expensive cold-sync workload.
  myotis-addon-load:
    needs: code-changed
    if: ${{ !cancelled() && needs.code-changed.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            addon: myotis-bin/mac-arm64/myotis-node.node
          - os: macos-15-intel
            target: darwin-x64
            addon: myotis-bin/mac-x64/myotis-node.node
          - os: ubuntu-latest
            target: linux-x64
            addon: myotis-bin/linux-x64/myotis-node.node
          - os: ubuntu-24.04-arm
            target: linux-arm64
            addon: myotis-bin/linux-arm64/myotis-node.node
          - os: windows-latest
            target: win32-x64
            addon: myotis-bin/win-x64/myotis-node.node
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        uses: ./.github/actions/install-node-deps
        with:
          ignore-scripts: 'true'

      - name: Download this runner's official Myotis addon
        run: npm run myotis:download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MYOTIS_DOWNLOAD_TARGET: ${{ matrix.target }}

      - name: Load addon and verify ABI
        run: node -e "const addon=require('./'+process.env.MYOTIS_ADDON); const abi=addon.init(); if(abi!==26) throw new Error('Expected ABI 26, got '+abi); if(typeof addon.createWithCheckpoint!=='function') throw new Error('Missing checkpoint import API'); console.log(process.platform+'-'+process.arch+' ABI '+abi);"
        env:
          MYOTIS_ADDON: ${{ matrix.addon }}

  # Real Myotis release-addon + Freedom resolver E2E on every operating
  # system we ship. One production-app launch cold-syncs over libp2p/devp2p,
  # proves direct verified Ethereum + Gnosis reads, then exercises ENS plus
  # WNS/GNS through Freedom's Myotis resolver tier. Avoid a raw-smoke launch
  # followed by an immediate app restart: persisted peer backoff can leave the
  # second client temporarily unable to reacquire a usable snap peer even
  # though the first launch just served verified reads.
  #
  # Cold sync can take 30-40 minutes. Cache restore/save are split so a timed
  # out first attempt still preserves its cleanly-stopped partial sync; a
  # re-run continues from that snapshot instead of starting from zero.
  #
  # The pinned v0.1.10 release carries the catch-up stall fix that first landed
  # in v0.1.9 (observed as of 2026-09). Run the live spec normally;
  # stale anchors fail explicitly and never receive automatic risk consent.
  myotis-native-e2e:
    # Live peers and expiring trust anchors need an explicit qualification run.
    # Unit and native-load checks still run on ordinary PRs; the separate
    # Windows supervisor workflow retains its existing push/manual triggers.
    if: github.event_name == 'workflow_dispatch' && inputs.myotis_live
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            addon: myotis-bin/mac-arm64/myotis-node.node
          - os: ubuntu-latest
            target: linux-x64
            addon: myotis-bin/linux-x64/myotis-node.node
          - os: windows-latest
            target: win32-x64
            addon: myotis-bin/win-x64/myotis-node.node
    runs-on: ${{ matrix.os }}
    # Spec budget is READY_TIMEOUT * 2 + 10 min = 60 min; the rest covers
    # npm ci, Playwright deps, and the two addon downloads.
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux native USB build dependency
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-native-deps

      - name: Install dependencies
        uses: ./.github/actions/install-node-deps

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-playwright-deps

      - name: Download official Myotis addon
        run: npm run myotis:download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MYOTIS_DOWNLOAD_TARGET: ${{ matrix.target }}

      - name: Build Myotis supervisor from source (POSIX)
        if: runner.os != 'Windows'
        run: npm run myotis:build-supervisor

      - name: Build Myotis supervisor from source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Installed x64 MSVC tools are required; no compiler will be downloaded.' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          npm run myotis:build-supervisor -- x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert native-addon target
        run: node -e "const actual=process.platform+'-'+process.arch; const expected=process.env.EXPECTED_TARGET; if(actual!==expected) throw new Error('expected '+expected+', got '+actual); console.log(actual);"
        env:
          EXPECTED_TARGET: ${{ matrix.target }}

      - name: Restore Myotis sync snapshot
        id: myotis-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/myotis-data
          key: myotis-${{ hashFiles('scripts/fetch-myotis.js', 'scripts/myotis-release.json') }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            myotis-${{ hashFiles('scripts/fetch-myotis.js', 'scripts/myotis-release.json') }}-${{ matrix.target }}-

      - name: Download IPFS native addon
        run: npm run ipfs:download
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run Freedom Myotis resolver E2E
        shell: bash
        env:
          MYOTIS_DATA_DIR: ${{ runner.temp }}/myotis-data
          MYOTIS_NODE_PATH: ${{ github.workspace }}/${{ matrix.addon }}
          # The one observed successful cold sync (run 32313049340) reached a
          # verified read in ~18 min, almost all of it execution-layer peer
          # hunting after the beacon client synced in 15 s. 25 min leaves
          # headroom without inviting another 1.3 h stall: a wedged catch-up
          # now aborts on the stall guard inside the spec instead.
          MYOTIS_E2E_READY_TIMEOUT_MIN: '25'
          # The stall window keeps its 3-minute default, which must stay below
          # the readiness budget above for the guard to be reachable at all
          # (test-e2e/live/myotis-sync-guard.js owns and unit-tests that
          # invariant).
          FREEDOM_TEST_HIDE_WINDOW: '1'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:e2e:live -- test-e2e/live/myotis-ens.spec.js
          else
            npm run test:e2e:live -- test-e2e/live/myotis-ens.spec.js
          fi

      # Nothing runs the native client when the spec skips, so the data dir may
      # not exist at all — actions/cache/save fails outright on a missing path,
      # and saving an empty dir would shadow a genuinely warm snapshot on the
      # next prefix restore.
      #
      # Evidence for each branch, so a future reader knows what is proven:
      #   present=true  — ubuntu-latest and macos-14 (run 33450528176, cache
      #                   restore hit), and windows-latest via a forced
      #                   manual dispatch, which populates the data
      #                   dir before the stall guard aborts.
      #   present=false — windows-latest (run 33450528176: cache miss + skip,
      #                   the case that would have failed the job outright under
      #                   the previous `if: always()` save).
      - name: Check for a Myotis sync snapshot
        id: myotis-snapshot
        if: always()
        shell: bash
        env:
          MYOTIS_DATA_DIR: ${{ runner.temp }}/myotis-data
        run: |
          # runner.temp is a native path, so on Windows this arrives as
          # 'D:\a\_temp/myotis-data'. Normalize to forward slashes before
          # handing it to msys `ls`, which is the only separator form it is
          # documented to accept, and echo the result so the branch taken is
          # visible in the log.
          dir="${MYOTIS_DATA_DIR//\\//}"
          if [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
            present=true
          else
            present=false
          fi
          echo "snapshot dir: $dir (present=$present)"
          echo "present=$present" >> "$GITHUB_OUTPUT"

      - name: Save Myotis sync snapshot
        if: always() && steps.myotis-snapshot.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/myotis-data
          key: myotis-${{ hashFiles('scripts/fetch-myotis.js', 'scripts/myotis-release.json') }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: myotis-native-e2e-${{ matrix.target }}-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Settings navigation, persistence, and chain policy are shipped control
  # surfaces. Exercise their real renderer/webview integration so malformed
  # sidebar markup, broken transitions, and Myotis policy regressions cannot
  # pass unit-only CI.
  e2e-settings:
    needs: code-changed
    if: ${{ !cancelled() && needs.code-changed.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux native USB build dependency
        uses: ./.github/actions/install-linux-native-deps

      - name: Install dependencies
        uses: ./.github/actions/install-node-deps

      - name: Install Playwright system dependencies
        uses: ./.github/actions/install-playwright-deps

      - name: Download adblock filter lists
        run: npm run adblock:download

      - name: Run settings E2E
        run: xvfb-run -a npm run test:e2e -- test-e2e/settings.spec.js test-e2e/settings-adblock.spec.js

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-settings-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # The keyboard shortcut registry is the only source of truth for menu
  # accelerators, the renderer keydown fallback and the Settings > Shortcuts
  # remap flow, and unit tests can only prove the three agree on paper. These
  # two specs drive the real main → preload → renderer round trip, so a
  # regression in it cannot pass unit-only CI (previously they ran locally
  # only — see #180).
