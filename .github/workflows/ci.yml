name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Feature-branch supersession is useful, but main's long native network
  # proof must be allowed to finish even if another merge lands meanwhile.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run lint
        run: npm run lint

      - name: Run test coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  # v0.8.0 upgrade / profile-migration coverage on all three desktop platforms.
  # The bee->ant carry has OS-specific filesystem semantics (Windows EPERM on
  # locked handles, rename-vs-copy fallbacks), so the migration + profile
  # resolver/paths suites must be green on Windows and macOS too — not just the
  # ubuntu-only `test` job. Pure jest, no display or native nodes required.
  migration-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run migration + profile suites
        run: npm run test:migration

  # freedom-ipfs native addon smoke for every desktop addon target currently
  # published in the pinned prebuilt manifest. This downloads the real release
  # artifact, loads it in Node, starts native freedom-ipfs, and retrieves a real
  # IPNS page through the native request API.
  freedom-ipfs-native-addon:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Assert shipped native-addon target
        run: node -e "const target = process.platform + '-' + process.arch; const expected = process.env.EXPECTED_TARGET; if (target !== expected) { console.error('Expected ' + expected + ' runner, got ' + target); process.exit(1); } console.log(target);"
        env:
          EXPECTED_TARGET: ${{ matrix.target }}

      - name: Download IPFS native addon
        run: npm run ipfs:download
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Smoke test IPFS native addon
        run: npm run ipfs:native:smoke
        env:
          FREEDOM_IPFS_NATIVE_SMOKE_TARGET: ${{ matrix.target }}
          FREEDOM_IPFS_NATIVE_SMOKE_PATH: /ipns/ipfs.tech/
          FREEDOM_IPFS_NATIVE_SMOKE_EXPECT: ipfs

      - name: Smoke test issue #102 high-fanout IPFS page
        if: matrix.target == 'linux-x64'
        run: npm run ipfs:native:smoke
        env:
          FREEDOM_IPFS_NATIVE_SMOKE_TARGET: ${{ matrix.target }}
          FREEDOM_IPFS_NATIVE_SMOKE_LIVE: '0'
          FREEDOM_IPFS_NATIVE_SMOKE_ISSUE_102: '1'

  # Load every native Myotis addon target that release packaging requires.
  # The live network proof below remains one representative architecture per
  # shipped OS; this fast matrix closes the packaging gap for Intel macOS and
  # ARM64 Linux without multiplying the expensive cold-sync workload.
  myotis-addon-load:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            addon: myotis-bin/mac-arm64/myotis-node.node
          - os: macos-15-intel
            target: darwin-x64
            addon: myotis-bin/mac-x64/myotis-node.node
          - os: ubuntu-latest
            target: linux-x64
            addon: myotis-bin/linux-x64/myotis-node.node
          - os: ubuntu-24.04-arm
            target: linux-arm64
            addon: myotis-bin/linux-arm64/myotis-node.node
          - os: windows-latest
            target: win32-x64
            addon: myotis-bin/win-x64/myotis-node.node
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download this runner's Myotis addon
        run: npm run myotis:download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MYOTIS_DOWNLOAD_TARGET: ${{ matrix.target }}

      - name: Load addon and verify ABI
        run: node -e "const addon=require('./'+process.env.MYOTIS_ADDON); const abi=addon.init(); if(abi!==22) throw new Error('Expected ABI 22, got '+abi); console.log(process.platform+'-'+process.arch+' ABI '+abi);"
        env:
          MYOTIS_ADDON: ${{ matrix.addon }}

  # Real Myotis release-addon + Freedom resolver E2E on every operating
  # system we ship. One production-app launch cold-syncs over libp2p/devp2p,
  # proves direct verified Ethereum + Gnosis reads, then exercises ENS plus
  # WNS/GNS through Freedom's Myotis resolver tier. Avoid a raw-smoke launch
  # followed by an immediate app restart: persisted peer backoff can leave the
  # second client temporarily unable to reacquire a usable snap peer even
  # though the first launch just served verified reads.
  #
  # Cold sync can take 30-40 minutes. Cache restore/save are split so a timed
  # out first attempt still preserves its cleanly-stopped partial sync; a
  # re-run continues from that snapshot instead of starting from zero.
  myotis-native-e2e:
    # A feature branch with an open PR otherwise launches this 30-40 minute
    # live-network matrix twice (push + pull_request), doubling cost and exposure
    # to transient peer selection. Keep PR/manual gates and post-merge coverage on main.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            addon: myotis-bin/mac-arm64/myotis-node.node
          - os: ubuntu-latest
            target: linux-x64
            addon: myotis-bin/linux-x64/myotis-node.node
          - os: windows-latest
            target: win32-x64
            addon: myotis-bin/win-x64/myotis-node.node
    runs-on: ${{ matrix.os }}
    timeout-minutes: 190

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux native USB build dependency
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-native-deps

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps

      - name: Download Myotis release addons
        run: npm run myotis:download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MYOTIS_DOWNLOAD_TARGET: ${{ matrix.target }}

      - name: Assert native-addon target
        run: node -e "const actual=process.platform+'-'+process.arch; const expected=process.env.EXPECTED_TARGET; if(actual!==expected) throw new Error('expected '+expected+', got '+actual); console.log(actual);"
        env:
          EXPECTED_TARGET: ${{ matrix.target }}

      - name: Restore Myotis sync snapshot
        id: myotis-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/myotis-data
          key: myotis-${{ hashFiles('scripts/fetch-myotis.js') }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            myotis-${{ hashFiles('scripts/fetch-myotis.js') }}-${{ matrix.target }}-

      - name: Download IPFS native addon
        run: npm run ipfs:download
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run Freedom Myotis resolver E2E
        shell: bash
        env:
          MYOTIS_DATA_DIR: ${{ runner.temp }}/myotis-data
          MYOTIS_NODE_PATH: ${{ github.workspace }}/${{ matrix.addon }}
          MYOTIS_E2E_READY_TIMEOUT_MIN: '75'
          FREEDOM_TEST_HIDE_WINDOW: '1'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:e2e:live -- test-e2e/live/myotis-ens.spec.js
          else
            npm run test:e2e:live -- test-e2e/live/myotis-ens.spec.js
          fi

      - name: Save Myotis sync snapshot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/myotis-data
          key: myotis-${{ hashFiles('scripts/fetch-myotis.js') }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: myotis-native-e2e-${{ matrix.target }}-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Settings navigation, persistence, and chain policy are shipped control
  # surfaces. Exercise their real renderer/webview integration so malformed
  # sidebar markup, broken transitions, and Myotis policy regressions cannot
  # pass unit-only CI.
  e2e-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux native USB build dependency
        uses: ./.github/actions/install-linux-native-deps

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Download adblock filter lists
        run: npm run adblock:download

      - name: Run settings E2E
        run: xvfb-run -a npm run test:e2e -- test-e2e/settings.spec.js test-e2e/settings-adblock.spec.js

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-settings-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Onboarding wizard must create node identities while a real Swarm node (now
  # antd) is running. Drives the full password wizard end-to-end against a real
  # antd spawn across all three desktop platforms — the cross-platform proof
  # that the bundled Ant node starts, goes healthy, and accepts an injected
  # identity. (antd self-initializes its identity and reads the injected
  # keys/swarm.key; it has no LevelDB statestore, but the wizard's
  # stop→wipe→reinject→restart flow is still exercised.)
  e2e-onboarding-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux native USB build dependency
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-native-deps

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps

      - name: Download Ant (antd) binary
        # Version pinned in scripts/fetch-ant.js so CI tests exactly what releases ship.
        run: npm run ant:download
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download IPFS native addon
        run: npm run ipfs:download
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Upgrade-path proof on every desktop platform: antd must adopt a
      # migrated bee-era identity (decrypt keys/swarm.key with the carried-over
      # config password) instead of self-generating a throwaway wallet. The
      # Windows leg matters most — EPERM-on-locked-handle is the historical
      # failure class for these data-dir moves (issue #90).
      - name: Run bee-data → ant-data migration integration test
        run: npx jest --forceExit src/main/identity/__tests__/integration/bee-to-ant-migration.test.js

      - name: Run onboarding identity E2E
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:e2e:onboarding
          else
            npm run test:e2e:onboarding
          fi

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-onboarding-identity-${{ matrix.os }}-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Standalone Ant live E2E: prove the bundled antd node starts, connects to the
  # Swarm network (peer count climbs), and serves real content the browser
  # requests — `meinhard.eth` is a Swarm-hosted (bzz://) site. This is the
  # headless, real-network validation that Ant is a working bee drop-in for
  # downloads. Linux-only to keep CI cheap; the cross-platform spawn proof lives
  # in e2e-onboarding-identity above.
  e2e-ant:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux native USB build dependency
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-native-deps

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Download Ant (antd) binary
        # Version pinned in scripts/fetch-ant.js so CI tests exactly what releases ship.
        run: npm run ant:download
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download IPFS binary
        run: npm run ipfs:download
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run Ant live download E2E (headless)
        run: xvfb-run -a npm run test:e2e:live -- test-e2e/live/eth-sites.spec.js

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ant-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Issue #69 — address-bar clipboard: Win/Linux menu wiring + chrome context menu (all platforms).
  e2e-address-bar-clipboard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux native USB build dependency
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-native-deps

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps

      - name: Run address-bar clipboard E2E
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:e2e -- test-e2e/address-bar-clipboard.spec.js
          else
            npm run test:e2e -- test-e2e/address-bar-clipboard.spec.js
          fi

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-address-bar-clipboard-${{ matrix.os }}-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Profile lifecycle (create / use / manage / delete) across all desktop
  # platforms. Runs the in-process harness in catalog mode (no real nodes, no
  # second-process spawn — see test-e2e/profiles-fixtures.js).
  e2e-profiles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux native USB build dependency
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-native-deps

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps

      - name: Run profile lifecycle E2E
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:e2e -- test-e2e/profiles.spec.js
          else
            npm run test:e2e -- test-e2e/profiles.spec.js
          fi

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-profiles-${{ matrix.os }}-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
