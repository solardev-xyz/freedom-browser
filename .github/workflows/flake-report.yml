name: Flake report
run-name: Flake report (last ${{ inputs.days || '7' }} days)

# A weekly look at what flaked in CI (#535): which jobs auto-retry.yml had to
# re-run and why, and which tests passed only on a Playwright retry. Written to
# this run's step summary; nothing is commented, filed or changed. The logic
# lives in scripts/ci/flake-report.js, which also runs locally with `gh`.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      days:
        description: How many days back to look
        default: '7'

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  report:
    runs-on: ubuntu-latest
    # ~0.8 s a call measured live (300 calls in 4 min), so 800 calls ≈ 11 min.
    timeout-minutes: 30
    steps:
      - name: Check out the report script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci/flake-report.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Write the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || '7' }}
        run: node scripts/ci/flake-report.js --days "$DAYS" | tee -a "$GITHUB_STEP_SUMMARY"
